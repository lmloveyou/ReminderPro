<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2f6f5e">
    <meta name="description" content="A smart reminder calendar for tasks, appointments, and important things you do not want to forget.">
    <title>ReminderPro</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">Reminder calendar</p>
        <h1>ReminderPro</h1>
      </div>
    </header>

    <main class="app-shell">
      <section class="panel form-panel" aria-labelledby="formTitle">
        <div class="section-heading">
          <p class="eyebrow">New reminder</p>
          <h2 id="formTitle">Add something important</h2>
        </div>

        <form id="reminderForm" class="reminder-form">
          <input id="editingId" type="hidden">

          <label>
            Title
            <input id="title" name="title" type="text" placeholder="Doctor appointment" required>
          </label>

          <div class="field-row">
            <label>
              Type
              <select id="type" name="type">
                <option value="task">Task</option>
                <option value="appointment">Appointment</option>
                <option value="important">Important</option>
              </select>
            </label>
            <label>
              Warn me
              <select id="leadTime" name="leadTime">
                <option value="0">At the time</option>
                <option value="10">10 minutes before</option>
                <option value="60">1 hour before</option>
                <option value="1440">1 day before</option>
              </select>
            </label>
          </div>

          <div class="field-row">
            <label>
              Date
              <input id="date" name="date" type="date" required>
            </label>
            <label>
              Time
              <input id="time" name="time" type="time" required>
            </label>
          </div>

          <label>
            Repeat
            <select id="repeat" name="repeat">
              <option value="none">Never</option>
              <option value="daily">Every day</option>
              <option value="weekly">Every week on this day</option>
            </select>
          </label>

          <fieldset>
            <legend>Send warning by</legend>
            <label class="check-row">
              <input id="channelEmail" type="checkbox" value="email" checked>
              Email
            </label>
            <label class="check-row">
              <input id="channelSms" type="checkbox" value="sms">
              SMS
            </label>
          </fieldset>

          <div class="field-row">
            <label>
              Email address
              <input id="email" name="email" type="email" placeholder="you@example.com">
            </label>
            <label>
              Phone number
              <input id="phone" name="phone" type="tel" placeholder="+324...">
            </label>
          </div>

          <label>
            Notes
            <textarea id="notes" name="notes" rows="3" placeholder="What do you need to remember?"></textarea>
          </label>

          <div class="form-actions">
            <button class="primary-button" id="submitButton" type="submit">Add reminder</button>
            <button class="ghost-button hidden" id="cancelEditButton" type="button">Cancel edit</button>
          </div>
        </form>
      </section>

      <section class="overview-grid" aria-label="Reminder overview">
        <article class="stat-panel">
          <span class="stat-label">Open</span>
          <strong id="openCount">0</strong>
        </article>
        <article class="stat-panel urgent">
          <span class="stat-label">Due soon</span>
          <strong id="dueSoonCount">0</strong>
        </article>
        <article class="stat-panel danger">
          <span class="stat-label">Overdue</span>
          <strong id="overdueCount">0</strong>
        </article>
        <article class="stat-panel">
          <span class="stat-label">Done</span>
          <strong id="doneCount">0</strong>
        </article>
      </section>

      <section class="panel calendar-panel" aria-labelledby="calendarTitle">
        <div class="section-heading">
          <p class="eyebrow">Next 7 days</p>
          <h2 id="calendarTitle">Calendar</h2>
        </div>
        <div id="calendarGrid" class="calendar-grid"></div>
      </section>

      <section class="panel list-panel" aria-labelledby="listTitle">
        <div class="section-heading split-heading">
          <div>
            <p class="eyebrow">All reminders</p>
            <h2 id="listTitle">Reminder list</h2>
          </div>
          <div class="list-tools">
            <input id="search" type="search" placeholder="Search reminders">
            <select id="filter">
              <option value="all">All</option>
              <option value="open">Open</option>
              <option value="due-soon">Due soon</option>
              <option value="overdue">Overdue</option>
              <option value="done">Done</option>
            </select>
          </div>
        </div>
        <div class="utility-bar" aria-label="Reminder tools">
          <button class="action-button" id="exportButton" type="button">Export</button>
          <button class="action-button" id="importButton" type="button">Import</button>
          <button class="action-button" id="clearDoneButton" type="button">Clear done</button>
          <input class="hidden" id="importFile" type="file" accept="application/json">
        </div>
        <div id="emptyState" class="empty-state">
          Add your first reminder to start building your day.
        </div>
        <div id="reminderList" class="reminder-list"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
